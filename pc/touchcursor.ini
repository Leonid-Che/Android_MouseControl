; Конфигурация сервера TouchCursor.
; Положите этот файл рядом с TouchCursorServer.exe (или touchcursor_server.py).
; Все значения необязательные — комментарий/отсутствие = значение по умолчанию.
; Аргументы командной строки (--port, --scale, ...) имеют приоритет над файлом.

[server]
; TCP-порт для управления курсором (должен совпадать с портом в приложении Android)
port = 8721

; UDP-порт автопоиска сервера в Wi-Fi сети
udp_port = 8722

; Множитель чувствительности курсора (1.0 = 1:1, 1.5 = движения в 1.5 раза быстрее)
scale = 1.0

; FAIL-SAFE: перемещение курсора в левый верхний угол экрана = аварийный стоп
failsafe = false

; RFCOMM-канал Bluetooth для подключения смартфона (0 = Bluetooth выключен)
bt_channel = 22
