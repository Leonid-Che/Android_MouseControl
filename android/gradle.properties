# Project-wide Gradle settings.

# AndroidX (appcompat, material, constraintlayout) — ОБЯЗАТЕЛЬНО,
# иначе сборка падает с ошибкой checkDebugAarMetadata.
android.useAndroidX=true

# JVM-память для Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка модулей
org.gradle.parallel=true

# Кэш сборки ВРЕМЕННО ОТКЛЮЧЁН: старые записи build cache от прошлых
# сборок становятся причиной ошибки dexBuilderDebug
# ("Cannot access output property 'projectOutputs.dex' ...
#   Failed to create MD5 hash for file 'ControlService.dex'").
# После успешной чистой сборки кэш можно включить обратно: true.
org.gradle.caching=false
